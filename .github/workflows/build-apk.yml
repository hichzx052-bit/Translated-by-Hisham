name: Build APK
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-translator:
    name: "📱 Translated by Hisham APK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Recreate Android project files
        working-directory: translated_by_hisham
        run: |
          # Save our custom files
          cp android/app/src/main/AndroidManifest.xml /tmp/manifest_main.xml
          cp android/app/build.gradle /tmp/build_main.gradle 2>/dev/null || true
          # Create fresh Flutter android structure
          flutter create --platforms android --org com.hichamdzz .
          # Restore our custom manifest
          cp /tmp/manifest_main.xml android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: translated_by_hisham
        run: flutter pub get

      - name: Build APK
        working-directory: translated_by_hisham
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Main APK
        uses: actions/upload-artifact@v4
        with:
          name: Translated-by-Hisham-APK
          path: translated_by_hisham/build/app/outputs/flutter-apk/app-release.apk

  build-updater:
    name: "🔧 Update Manager APK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Recreate Android project files
        working-directory: update_manager
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/manifest_admin.xml 2>/dev/null || true
          flutter create --platforms android --org com.hichamdzz .
          cp /tmp/manifest_admin.xml android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Get dependencies
        working-directory: update_manager
        run: flutter pub get

      - name: Build APK
        working-directory: update_manager
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Update-Manager-APK
          path: update_manager/build/app/outputs/flutter-apk/app-release.apk
