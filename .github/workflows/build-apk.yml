name: Build APK
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-translator:
    name: "📱 Translated by Hisham APK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build Main App
        working-directory: translated_by_hisham
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Main APK
        uses: actions/upload-artifact@v4
        with:
          name: Translated-by-Hisham-APK
          path: translated_by_hisham/build/app/outputs/flutter-apk/app-release.apk

  build-updater:
    name: "🔧 Update Manager APK"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build Admin App
        working-directory: update_manager
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: Update-Manager-APK
          path: update_manager/build/app/outputs/flutter-apk/app-release.apk
