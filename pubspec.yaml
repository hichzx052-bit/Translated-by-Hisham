name: translated_by_hisham
description: Professional translation app by Hisham with voice, text, and overlay features.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core packages
  cupertino_icons: ^1.0.6
  
  # Translation & Language
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  translator: ^1.0.0
  google_mlkit_language_id: ^0.10.0
  
  # Overlay & Background
  flutter_overlay_window: ^0.5.0
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.5
  
  # Storage & Preferences
  shared_preferences: ^2.2.2
  permission_handler: ^11.3.1
  provider: ^6.1.1
  http: ^1.1.2
  path_provider: ^2.1.2
  
  # Notifications & UI
  flutter_local_notifications: ^17.0.0
  introduction_screen: ^3.1.12
  google_fonts: ^6.1.0
  lottie: ^3.1.0
  animated_text_kit: ^4.2.2
  
  # Development
  flutter_launcher_icons: ^0.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/animations/
    - assets/icon/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700